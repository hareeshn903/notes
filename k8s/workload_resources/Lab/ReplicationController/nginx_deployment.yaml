apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-demo-rc
  labels:
    app: rc-prod

spec:
  replicas: 3
  selector:
    app: nginx-prod
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx-prod
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.3
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "300Mi"
              cpu: "0.2"
            