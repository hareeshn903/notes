apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo
  labels:
    app: nginx
    environment: dev
spec:
  containers:
  - name: write-container
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo $(date) >> /var/log/index.html; sleep 10; done"]
    volumeMounts:
    - name: shared-data
      mountPath: /var/log
  - name: serving-container
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: shared-data
    emptyDir: {}