apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  labels:
    app: nginx
    environment: production
spec:
  replicas: 2
  # selector:
  #   matchLabels:
  #     app: nginx
  #     release: v1.0
  selector:
    matchLabels:
      app: nginx
      environment: production
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx
        environment: production
        release: v1.0
    spec:
      containers:
        - name: write-container
          image: alpine
          command: ["/bin/sh"]
          args: ["-c", "while true; do date >> /var/log/index.html; sleep 10; done"]
          volumeMounts:
            - name: shared-data
              mountPath: /var/log
        - name: service-container
          image: nginx:1.28.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: shared-data
          emptyDir: {}