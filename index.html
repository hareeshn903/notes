<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Docs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      padding: 20px;
      position: fixed;
      left: 0;
      top: 0;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      color: #ddd;
      text-decoration: none;
      margin: 10px 0;
    }

    .sidebar a:hover {
      color: white;
    }

    /* Content */
    .content {
      margin-left: 240px;
      padding: 20px;
      flex: 1;
    }

    /* Mobile menu button */
    .menu-btn {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      background: #007acc;
      color: white;
      border: none;
      padding: 10px;
      font-size: 18px;
      border-radius: 5px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: 0.3s;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .content {
        margin-left: 0;
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <!-- Menu Button (Mobile) -->
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>📚 Docs</h2>
    <a href="interview_questions/Untitled.md">Untitled</a>
    <a href="interview_questions/Untitled 1.md">Untitled 1</a>
    <a href="interview_questions/Untitled 2.md">Untitled 2</a>
        
  </div>

  <!-- Content -->
  <div class="content">
    <h1>Welcome 👋</h1>
    <p>Select a topic from the menu.</p>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("active");
    }
  </script>

</body>
</html>
