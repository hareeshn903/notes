apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-demo-rs
  labels:
    app: nginx
    environment: production
spec:
  replicas: 2
  # selector:
  #   matchLabels:
  #     app: nginx
  #     release: v1.0
  selector:
    MatchExpression:
      - key: app
        operator: In
        values:
          - nginx
      - key: release
        operator: In
        values:
          - v1.0

    MatchExpression:
      { key: app, operator: In, values: [nginx] }
      { key: release, operator: In, values: [v1.0,v1.1] }
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx
        environment: production
        release: v1.0
    spec:
      containers:
        - name: write-container
          image: alpine
          command: ["/bin/sh"]
          args: ["-c", "while true; do date >> /var/log/index.html; sleep 10; done"]
          volumeMounts:
            - name: shared-data
              mountPath: /var/log
        - name: service-container
          image: nginx:1.28.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: shared-data
          emptyDir: {}