apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-demo-rc
spec:
  replicas: 2
  selector:
    app: nginx
  template:
    metadata:
      name: nginx-demo
      labels:
        app: nginx
    spec:
      containers:
        - name: write-container
          image: alpine
          command: ["/bin/sh"]
          args: ["-c", "while true; do date >> /var/log/index.html; sleep 10; done"]
          volumeMounts:
            - name: shared-data
              mountPath: /var/log
        - name: service-container
          image: nginx:1.28.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: shared-data
          emptyDir: {}